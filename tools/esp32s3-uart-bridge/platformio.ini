; USB-to-UART bridge for the Waveshare ESP32-S3-Zero (ESP32-S3FH4R2, 4 MiB flash).
; Listens on two GPIOs, finds which one carries data and at what baud rate,
; then bridges it to the USB serial port (USB-Serial/JTAG, no driver needed).
[env:esp32-s3-zero]
; pioarduino platform (Arduino core 3.x, which the RMT code needs); the
; registry's plain "espressif32" is still on core 2.x
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_upload.flash_size = 4MB
board_build.partitions = default.csv
; Only ever open an Espressif USB device (303a:*). Without this, PlatformIO
; falls back to any serial port when the board isn't plugged in.
upload_port = hwgrep://VID:PID=303A:
monitor_port = hwgrep://VID:PID=303A:
monitor_speed = 115200
; Raw passthrough for U-Boot/Linux consoles; Enter sends CR. Every session is
; also saved to logs/device-monitor-*.log (gitignored: consoles print MACs and
; serial numbers). Leave DTR/RTS at their defaults (both asserted): forcing
; them low resets the S3 on open.
monitor_filters = direct, log2file
monitor_eol = CR
build_flags =
	-DARDUINO_USB_MODE=1
	-DARDUINO_USB_CDC_ON_BOOT=1
	-DPIN_A=7
	-DPIN_B=8
